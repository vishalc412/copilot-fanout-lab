name: Plan (no LLM)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/plan.py
      - name: Commit plan.json if it changed
        run: |
          if git diff --quiet -- codebase-analysis/plan.json; then
            echo "plan.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codebase-analysis/plan.json
          git commit -m "chore(plan): regenerate codebase-analysis/plan.json"
          git push
