name: Toolkit analysis (scripts, no LLM)
on:
  workflow_dispatch:
  pull_request:
    paths: ["bible/**"]
permissions:
  contents: read
env:
  S: .github/skills/analyzing-a-codebase/scripts
  ARGS: --repo . --analysis bible --exclude codebase-analysis --exclude .github
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inventory
        run: python -I $S/inventory.py $ARGS
      - name: Next job from the work loop
        run: python -I $S/next.py $ARGS --new-session
      - name: Knowledge graph and knowledge base
        run: python -I $S/knowledge.py $ARGS
      - name: Coverage gate (fails until the book is complete)
        if: github.event_name == 'pull_request'
        run: python -I $S/coverage.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bible-ledger-and-knowledge
          path: |
            bible/ledger/
            bible/knowledge/
