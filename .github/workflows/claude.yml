name: Claude (@claude mentions)
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # Only people with write access can wake the agent from a comment.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Mention received
        run: echo "@claude mention on #${{ github.event.issue.number || github.event.pull_request.number }} reached Actions."
      - name: Check for a Claude secret
        id: secret
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY$OAUTH" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret: the local stand-in harness answers this mention."; fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.secret.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
