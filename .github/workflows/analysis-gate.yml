name: Analysis gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One component per PR, inside its write scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --no-renames "$BASE"...HEAD > changed.txt
          cat changed.txt
          python - <<'PY'
          import os, re, sys
          files = [f for f in open("changed.txt").read().split() if f]
          comps, bad = set(), []
          for f in files:
              if f.startswith("bible/"):
                  comps.add("@book"); continue
              m = re.match(r"codebase-analysis/components/([a-z0-9_-]+)/", f) or re.match(r"components/([a-z0-9_-]+)/test_[A-Za-z0-9_]+\.py$", f)
              if m:
                  comps.add(m.group(1))
              else:
                  bad.append(f)
          if bad:
              print("Outside the write scope:", *bad, sep="\n  "); sys.exit(1)
          if len(comps) != 1:
              print("Expected exactly one component, got:", sorted(comps)); sys.exit(1)
          import json, subprocess
          base_plan = json.loads(subprocess.run(["git", "show", os.environ["BASE"] + ":codebase-analysis/plan.json"],
                                                capture_output=True, text=True, check=True).stdout)
          comp = comps.pop()
          if comp != "@book" and comp not in base_plan["components"]:
              print("Component not in the base branch plan.json:", comp); sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"component={comp}\n")
          PY
      - name: Gate for every pass in status.json
        # The book track (bible/) is gated by toolkit-analysis.yml's coverage gate.
        if: steps.scope.outputs.component != '@book'
        env:
          COMPONENT: ${{ steps.scope.outputs.component }}
        run: python tools/gate.py "$COMPONENT"
